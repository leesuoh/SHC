name: Deploy to OCI

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. 코드 받기 ──
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java 17 세팅 ──
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Spring Boot 빌드 ──
      - name: Build Spring Boot JAR
        run: |
          cd backend
          ./gradlew bootJar -x test
          echo "✅ Spring Boot 빌드 완료"

      # ── 4. Node.js 세팅 ──
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 5. React 빌드 ──
      - name: Build React
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_OCR_URL: ${{ secrets.VITE_OCR_URL }}
        run: |
          cd frontend
          npm ci
          npm run build
          echo "✅ React 빌드 완료"

      # ── 6. OCI 서버에 배포 ──
      - name: Deploy to OCI
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            echo "🚀 배포 시작"

            # 디렉토리 생성
            mkdir -p ~/shc/backend
            mkdir -p ~/shc/frontend
            mkdir -p ~/shc/ocr-ai

      # ── 7. 파일 전송 ──
      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "backend/build/libs/*.jar"
          target: "~/shc/backend/"
          strip_components: 2

      - name: Copy frontend build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "frontend/dist/*"
          target: "~/shc/frontend/"
          strip_components: 2

      - name: Copy OCR files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "ocr-ai/main.py,ocr-ai/requirements.txt"
          target: "~/shc/ocr-ai/"
          strip_components: 1

      # ── 8. 서버에서 재시작 ──
      - name: Restart services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            # Spring Boot 재시작
            sudo systemctl restart shc-backend
            echo "✅ 백엔드 재시작"

            # FastAPI 재시작
            sudo systemctl restart shc-ocr
            echo "✅ OCR 재시작"

            # Nginx 재로드 (React 정적파일 서빙)
            sudo systemctl reload nginx
            echo "✅ Nginx 재로드"

            echo "🎉 배포 완료!"
